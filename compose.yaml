services:
  ai-policy-viewer:
    build: .
    container_name: ai-policy-viewer
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/source/data:ro
      - policy-runtime:/runtime
    environment:
      - PYTHONUTF8=1
      - PYTHONUNBUFFERED=1
      - AI_POLICY_SOURCE_ROOT=/source
      - AI_POLICY_RUNTIME=/runtime
      - AI_POLICY_RELEASE=${AI_POLICY_RELEASE:-}
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  policy-runtime:
